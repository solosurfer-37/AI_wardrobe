<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — AI Wardrobe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body data-public="true">
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">
        <span class="auth-logo"><i data-lucide="shirt"></i></span>
        <span><b>AI Wardrobe</b><small>Smart Styling</small></span>
      </a>

      <h1 id="auth-title">Welcome back</h1>
      <p class="auth-sub" id="auth-sub">Sign in to open your closet.</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="active" data-mode="login">Sign in</button>
        <button type="button" data-mode="signup">Create account</button>
      </div>

      <form id="auth-form" novalidate>
        <label class="field field-username" hidden>
          <span>Username</span>
          <input type="text" id="auth-username" autocomplete="username" placeholder="e.g. riya_styles" />
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="auth-password" autocomplete="current-password" placeholder="At least 6 characters" required />
        </label>

        <p class="auth-msg" id="auth-msg" role="alert"></p>

        <button type="submit" class="auth-submit" id="auth-submit">Sign in</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
