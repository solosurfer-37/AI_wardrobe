<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Wardrobe — Browse, search, filter, and organize your clothing collection." />
  <title>My Wardrobe — AI Wardrobe</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
</head>
<body data-page="wardrobe">
  <!-- Mobile Overlay -->
  <div class="mobile-overlay" id="mobile-overlay"></div>

    </a>

    <nav class="glass-nav sidebar-nav" id="sidebar-nav">
      <a href="index.html" class="glass-logo glass-menu-logo">
        <span class="glass-logo-icon"><i data-lucide="shirt"></i></span>
        <span class="glass-logo-text"><h1>AI Wardrobe</h1><span class="logo-tagline">Smart Styling</span></span>
      </a>

      <button class="glass-close sidebar-close" id="sidebar-close" aria-label="Close menu">
        <i data-lucide="x"></i>
      </button>

      <ul class="glass-links">
        <li><a href="index.html" class="glass-link nav-item" data-page="dashboard" id="nav-dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></li>
        <li><a href="wardrobe.html" class="glass-link nav-item" data-page="wardrobe" id="nav-wardrobe"><i data-lucide="shirt"></i><span>My Wardrobe</span></a></li>
        <li><a href="outfits.html" class="glass-link nav-item" data-page="outfits" id="nav-outfits"><i data-lucide="sparkles"></i><span>Outfit Generator</span></a></li>
        <li><a href="analytics.html" class="glass-link nav-item" data-page="analytics" id="nav-analytics"><i data-lucide="bar-chart-3"></i><span>Analytics</span></a></li>
        <li><a href="settings.html" class="glass-link nav-item" data-page="settings" id="nav-settings"><i data-lucide="settings"></i><span>Settings</span></a></li>
      </ul>

    <button class="glass-burger" id="sidebar-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>

  </div>

<!-- ═══ Floating Add Button (bottom-left) ═══ -->
<button class="fab-add" id="btn-add-clothing-topbar" aria-label="Add clothing" title="Add clothing">
  <i data-lucide="plus"></i>
</button>

<!-- ═══ Main content ═══ -->
<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="glass-logo logo">
        <span class="glass-logo-icon logo-icon"><i data-lucide="shirt" class="logo-lucide"></i></span>
        <span class="glass-logo-text logo-text"><h1>AI Wardrobe</h1><span class="logo-tagline">Smart Styling</span></span>
      </a>
    </div>
    <div class="topbar-actions">
      <div class="glass-user sidebar-user">
        <div class="glass-avatar user-avatar">AW</div>
        <div class="user-info">
          <span class="user-name">Wardrobe User</span>
          <span class="user-role">Personal Stylist</span>
        </div>
      </div>
    </div>
  </header>

  <div class="page-container">
    <!-- yahan har page ka apna content -->
  </div>
</main>
  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <i data-lucide="menu"></i>
      </button>
      <div class="topbar-title" id="topbar-title">My Wardrobe</div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btn-add-clothing-topbar" title="Add Clothing">
          <i data-lucide="plus"></i>
        </button>
      </div>
    </header>

    <!-- Page Container -->
    <div class="page-container" id="page-container">
      <div class="wardrobe-page animate-fade-in">
        <!-- Top Toolbar & Controls -->
        <div class="wardrobe-toolbar">
          <div class="search-container">
            <i data-lucide="search" class="search-icon"></i>
            <input 
              type="text" 
              id="wardrobe-search-input" 
              class="search-input" 
              placeholder="Search by type, color, or pattern..." 
            />
          </div>

          <div class="filter-bar">
            <button class="filter-pill active" data-category="all">All</button>
            <button class="filter-pill" data-category="tops">Tops</button>
            <button class="filter-pill" data-category="bottoms">Bottoms</button>
            <button class="filter-pill" data-category="outerwear">Outerwear</button>
            <button class="filter-pill" data-category="footwear">Footwear</button>
          </div>

          <div style="display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap;">
            <select id="wardrobe-color-filter" class="select-input" style="height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--border-medium); background: var(--bg-card); font-size: var(--text-sm);">
              <option value="all">All Colors</option>
              <option value="white">White</option>
              <option value="black">Black</option>
              <option value="blue">Blue</option>
              <option value="red">Red</option>
              <option value="green">Green</option>
              <option value="navy">Navy</option>
              <option value="gray">Gray</option>
              <option value="brown">Brown</option>
              <option value="beige">Beige</option>
              <option value="pink">Pink</option>
              <option value="yellow">Yellow</option>
              <option value="orange">Orange</option>
              <option value="purple">Purple</option>
            </select>

            <select id="wardrobe-sort" class="select-input" style="height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--border-medium); background: var(--bg-card); font-size: var(--text-sm);">
              <option value="least-worn" selected>Least Worn First</option>
              <option value="most-worn">Most Worn First</option>
              <option value="type-asc">Type (A - Z)</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="price-asc">Price: Low to High</option>
            </select>

            <button class="btn btn-primary" id="btn-open-add-clothing" style="height: 40px;">
              <i data-lucide="plus"></i>
              Add Item
            </button>
          </div>
        </div>

        <div class="wardrobe-count" id="wardrobe-items-count">Loading items...</div>

        <!-- Clothing Grid -->
        <div class="wardrobe-grid" id="wardrobe-items-grid">
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
          <div class="skeleton clothing-card"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Add Clothing Modal -->
  <div class="modal-overlay" id="add-clothing-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Add New Clothing</h2>
        <button class="modal-close" id="modal-close-add" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-clothing-form" class="modal-form">
        <div class="form-group">
          <label for="clothing-type">Type <span class="required">*</span></label>
          <select id="clothing-type" required>
            <option value="">Select type...</option>
            <optgroup label="Tops">
              <option value="t-shirt">T-Shirt</option>
              <option value="shirt">Shirt</option>
              <option value="blouse">Blouse</option>
              <option value="top">Top</option>
            </optgroup>
            <optgroup label="Outerwear">
              <option value="jacket">Jacket</option>
              <option value="sweater">Sweater</option>
              <option value="hoodie">Hoodie</option>
            </optgroup>
            <optgroup label="Bottoms">
              <option value="pants">Pants</option>
              <option value="jeans">Jeans</option>
              <option value="shorts">Shorts</option>
              <option value="skirt">Skirt</option>
              <option value="trousers">Trousers</option>
            </optgroup>
            <optgroup label="Footwear">
              <option value="shoes">Shoes</option>
              <option value="sneakers">Sneakers</option>
              <option value="boots">Boots</option>
              <option value="sandals">Sandals</option>
              <option value="loafers">Loafers</option>
            </optgroup>
          </select>
          <span class="form-error" id="error-type"></span>
        </div>

        <div class="form-group">
          <label for="clothing-color">Color <span class="required">*</span></label>
          <select id="clothing-color" required>
            <option value="">Select color...</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="navy">Navy</option>
            <option value="gray">Gray</option>
            <option value="brown">Brown</option>
            <option value="beige">Beige</option>
            <option value="pink">Pink</option>
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="purple">Purple</option>
          </select>
          <span class="form-error" id="error-color"></span>
        </div>

        <div class="form-group">
          <label for="clothing-pattern">Pattern</label>
          <input type="text" id="clothing-pattern" placeholder="e.g. solid, plaid, striped..." />
        </div>

        <div class="form-group">
          <label for="clothing-image">Image URL</label>
          <input type="url" id="clothing-image" placeholder="https://example.com/image.jpg" />
        </div>

        <div class="form-group">
          <label for="clothing-price">Price ($)</label>
          <input type="number" id="clothing-price" placeholder="0.00" step="0.01" min="0" />
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-add">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-add">
            <i data-lucide="plus"></i>
            Add to Wardrobe
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Clothing Detail Modal -->
  <div class="modal-overlay" id="clothing-detail-modal">
    <div class="modal modal-detail">
      <div class="modal-header">
        <h2 id="detail-title">Clothing Detail</h2>
        <button class="modal-close" id="modal-close-detail" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="detail-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/dummyData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/pages/wardrobe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
