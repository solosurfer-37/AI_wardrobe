spring.application.name=smart-wardrobe

# ── Supabase PostgreSQL Database (loaded from .env or environment) ──
spring.datasource.url=${SUPABASE_DB_URL=jdbc:postgresql://db.spitnxgxefrsxzbqvdbd.supabase.co:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# ── JPA / Hibernate for PostgreSQL ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Supabase Storage (Image Uploads) ──
supabase.url=${SUPABASE_URL:https://spitnxgxefrsxzbqvdbd.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:wardrobe-images}

# ── Multipart upload size limits ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

